services:
  postgres:
    image: postgres:16-alpine
    container_name: mylinks_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mylinks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mylinks_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mylinks}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mylinks}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
